services:
  postgres:
    image: postgres:16-alpine
    container_name: archpilot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archpilot
    ports:
      - "5432:5432"
    volumes:
      - archpilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  archpilot_pg:
